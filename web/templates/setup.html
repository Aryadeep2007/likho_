{{define "content"}}

<div class="pagehead">
  <h1>✍️ Likho me swagat hai</h1>
  <p class="muted">Pehla (aur is blog ka ek hi) admin account bana lo — isi se likhoge,
  edit karoge, comments moderate karoge, dashboard dekhoge. Baaki sab bas padh sakte hain.</p>
</div>

<div class="box auth-box">
  {{if .Error}}<div class="error-box">{{.Error}}</div>{{end}}
  <form method="post" action="/setup">
    <div class="form-field">
      <label for="su-username">Username</label>
      <input id="su-username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-field">
      <label for="su-display">Naam jo posts pe dikhega</label>
      <input id="su-display" name="display_name" placeholder="jaise: Aryan" autocomplete="name">
    </div>
    <div class="form-field">
      <label for="su-pass">Password <span class="muted small">(kam se kam 8 characters)</span></label>
      <input id="su-pass" type="password" name="password" minlength="8" autocomplete="new-password" required>
    </div>
    <div class="form-field">
      <label for="su-confirm">Password dobara</label>
      <input id="su-confirm" type="password" name="confirm" minlength="8" autocomplete="new-password" required>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Account banao aur shuru karo</button>
    </div>
  </form>
</div>

{{end}}
